    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(st); chunks = []; cancelled = false;
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data) };
    rec.onstop = async () => {
      clearInterval(rtimer); st.getTracks().forEach(t => t.stop());
      const r = rec; rec = null; $("#rb").style.display = "none"; $("#cmp").style.display = "flex";
      if (cancelled || !chunks.length) return;
      try { toast("Gönderiliyor…"); const url = await upload(new Blob(chunks, { type: r.mimeType || "audio/webm" })); await send({ kind: "audio", media_url: url }) } catch (x) { toast("Sesli mesaj gönderilemedi") }
    };
    rec.start(); rt0 = Date.now(); $("#rtm").textContent = "0:00";
    $("#cmp").style.display = "none"; $("#rb").style.display = "flex";
    rtimer = setInterval(() => { const s = Math.floor((Date.now() - rt0) / 1000); $("#rtm").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (s >= 120) stopRec(false) }, 500);
  } catch (x) { toast("Mikrofon izni verilmedi. Chrome'da siteye mikrofon izni ver.") }
}
function stopRec(cancel) { if (!rec) return; cancelled = cancel; rec.stop() }

/* ---- BAŞLAT ---- */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
/* ---- KLAVYE: ekran zıplamasın ---- */
if (window.visualViewport) {
  const vv = visualViewport, fit = () => {
    app.style.bottom = "auto"; app.style.height = vv.height + "px"; app.style.top = vv.offsetTop + "px";
    const a = document.activeElement; if (a && a.id === "tx") { const b = $("#msgs"); if (b) b.scrollTop = b.scrollHeight }
  };
  vv.addEventListener("resize", fit); addEventListener("resize", fit); vv.addEventListener("scroll", () => { window.scrollTo(0, 0); fit() }); fit();
  document.addEventListener("focusin", e => { if (e.target.id === "tx") { setTimeout(() => { window.scrollTo(0, 0); fit() }, 120); setTimeout(fit, 400) } });
}

sb.auth.onAuthStateChange((ev, s) => {
  if (s && s.user) setTimeout(() => enter(s.user), 0);
  else if (ev === "SIGNED_OUT") { cleanup(); showAuth() }
});
sb.auth.getSession().then(({ data }) => { if (!data.session) showAuth() });
</script>
